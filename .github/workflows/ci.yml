name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Assert no service-role key in client bundles
        run: |
          if grep -RiE "service_role|SERVICE_ROLE" apps/web/dist/ 2>/dev/null; then
            echo "::error::service-role material found in client bundle" && exit 1
          fi

  migration-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply all migrations to a fresh database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS postgis;"
          # Supabase-managed schemas/roles that migrations reference
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/ci/supabase_shim.sql
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
          for f in supabase/seed/*.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
